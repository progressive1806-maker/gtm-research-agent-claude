name: Run GTM Research Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test or production"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - production
      memo:
        description: "What are you testing?"
        required: false
        default: "manual-test"
      enable_g2b:
        description: "Enable optional G2B (나라장터) API integration"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      g2b_bid_endpoint:
        description: "G2B bid-notice service root (leave empty to disable)"
        required: false
        default: ""
      g2b_spec_endpoint:
        description: "G2B pre-spec service root (leave empty to disable)"
        required: false
        default: ""
      google_cse_id:
        description: "Google Programmable Search Engine ID (cx). Optional fallback after Gemini grounding."
        required: false
        default: ""
      enable_gemini_grounding:
        description: "Use Gemini's google_search grounding for LinkedIn discovery (preferred)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      enable_jira:
        description: "Enable Jira DMD existing-touchpoint lookup (requires JIRA_BASE_URL + JIRA_TOKEN secrets)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  # Scheduled run is paused while the pipeline is being refactored.
  # Re-enable by uncommenting the block below once new architecture is ready.
  # schedule:
  #   # Monday 08:07 KST = Sunday 23:07 UTC
  #   - cron: "7 23 * * 0"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'production' || inputs.mode }}
          RUN_MEMO: ${{ github.event_name == 'schedule' && 'weekly-scheduled-run' || inputs.memo }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-3.5-flash
          MAX_LLM_SOURCES: 40
          MAX_SOURCE_CHARS: 800
          MAX_OUTPUT_CANDIDATES: 12
          ENABLE_G2B: ${{ github.event.inputs.enable_g2b }}
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          G2B_BID_ENDPOINT: ${{ github.event.inputs.g2b_bid_endpoint }}
          G2B_SPEC_ENDPOINT: ${{ github.event.inputs.g2b_spec_endpoint }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ github.event.inputs.google_cse_id }}
          ENABLE_GEMINI_GROUNDING: ${{ github.event.inputs.enable_gemini_grounding }}
          ENABLE_JIRA: ${{ github.event.inputs.enable_jira }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
        run: |
          python agent/run.py

      - name: Build GitHub Pages
        run: |
          python agent/build_pages.py

      - name: Commit run outputs
        run: |
          git config user.name "gtm-research-bot"
          git config user.email "gtm-research-bot@users.noreply.github.com"
          git add runs docs
          git commit -m "Add GTM research run output" || echo "No changes to commit"
          git push
