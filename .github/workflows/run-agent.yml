name: Run GTM Research Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test or production"
        required: true
        default: "test"
        type: choice
        options:
          - test
          - production
      memo:
        description: "What are you testing?"
        required: false
        default: "manual-test"

  schedule:
    # Monday 08:07 KST = Sunday 23:07 UTC
    - cron: "7 23 * * 0"

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent
        env:
          RUN_MODE: ${{ github.event_name == 'schedule' && 'production' || inputs.mode }}
          RUN_MEMO: ${{ github.event_name == 'schedule' && 'weekly-scheduled-run' || inputs.memo }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: gemini
          LLM_MODEL: gemini-3.5-flash
          MAX_LLM_SOURCES: 40
          MAX_SOURCE_CHARS: 800
          MAX_OUTPUT_CANDIDATES: 12
        run: |
          python agent/run.py

      - name: Commit run outputs
        run: |
          git config user.name "gtm-research-bot"
          git config user.email "gtm-research-bot@users.noreply.github.com"
          git add runs docs
          git commit -m "Add GTM research run output" || echo "No changes to commit"
          git push
